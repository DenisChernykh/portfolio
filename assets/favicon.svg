<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title>DC favicon</title>
  <desc>Dark rounded DC monogram with electric AI workflow nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="10" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141a20"/>
      <stop offset="0.55" stop-color="#090c10"/>
      <stop offset="1" stop-color="#12140e"/>
    </linearGradient>
    <linearGradient id="accent" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8ff3e"/>
      <stop offset="1" stop-color="#55d7c6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <path d="M13 45V19h12c8 0 13 5 13 13s-5 13-13 13H13Zm7-6h4.6c4.4 0 6.8-2.6 6.8-7s-2.4-7-6.8-7H20v14Z" fill="#f7f6ed"/>
