  <path d="M17 15h30M17 49h30" stroke="#d8ff3e" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  <path d="M48 15l7 7M48 49l7-7" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="17" cy="15" r="3.2" fill="#d8ff3e" filter="url(#glow)"/>
  <circle cx="47" cy="15" r="2.4" fill="#55d7c6" filter="url(#glow)"/>
  <circle cx="47" cy="49" r="2.4" fill="#d8ff3e" filter="url(#glow)"/>
